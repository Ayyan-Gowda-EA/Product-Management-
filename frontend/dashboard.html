
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>Product Management</h1>
                <p>Manage your products easily</p>
            </div>

            <div>
                <button
                    type="button"
                    onclick="window.location.href='profile.html'">
                    My Profile
                </button>

                <button id="logout-btn">Logout</button>
            </div>
        </header>

        <section class="product-form-section">

            <h2>Welcome!</h2>

            <p><strong>Name:</strong> <span id="user-name">Loading...</span></p>
            <p><strong>Email:</strong> <span id="user-email">Loading...</span></p>

        </section>

        <section class="product-form-section">

            <h2 id="form-heading">Add New Product</h2>

            <form id="product-form">

                <input type="number" id="product-id"
                    placeholder="Product ID" required>

                <input type="text" id="product-name"
                    placeholder="Product Name" required>

                <input type="text" id="product-description"
                    placeholder="Product Description" required>

                <input type="number" id="product-price"
                    placeholder="Price" step="0.01" min="0" required>

                <input type="number" id="product-quantity"
                    placeholder="Quantity" min="0" required>

                <button type="submit" id="save-btn">
                    Add Product
                </button>

                <button type="button" id="cancel-btn" hidden>
                    Cancel
                </button>

            </form>

            <p id="product-message"></p>

        </section>

        <section class="product-list-section">

            <h2>All Products</h2>

            <button type="button" id="refresh-btn">
                Refresh Products
            </button>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="product-table-body">
                    </tbody>

                </table>

            </div>

            <p id="empty-message"></p>

        </section>

    </div>

    <script src="dashboard.js"></script>

</body>
</html>
